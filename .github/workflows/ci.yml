name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mimt/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mimt/web build
      - name: Check bilingual static export
        run: node apps/web/scripts/check-export.mjs
      - name: Publish static website artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: mimt-web-static
          path: apps/web/out/
          if-no-files-found: error
          retention-days: 7
