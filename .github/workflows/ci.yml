name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_only
          POSTGRES_DB: mimt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mimt_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mimt/shared build
      - run: pnpm typecheck
      - name: Run tests (including isolated PostgreSQL concurrency)
        env:
          MIMT_RATE_LIMIT_TEST_DATABASE_URL: postgresql://postgres:postgres_test_only@localhost:5432/mimt_ci
        run: pnpm test
      - name: Verify configured public forms endpoint
        shell: bash
        env:
          NEXT_PUBLIC_FORMS_ENDPOINT: ${{ vars.MIMT_WEB_FORMS_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -n "$NEXT_PUBLIC_FORMS_ENDPOINT" ] && [ "$NEXT_PUBLIC_FORMS_ENDPOINT" != "https://api.mimt.ca/v1/public/leads" ]; then
            echo "Invalid public form endpoint; refusing to build with a foreign destination."
            exit 1
          fi
      - name: Build public site
        env:
          NEXT_PUBLIC_FORMS_ENDPOINT: ${{ vars.MIMT_WEB_FORMS_ENDPOINT }}
        run: pnpm --filter @mimt/web build
      - name: Check bilingual static export
        run: node apps/web/scripts/check-export.mjs
      - name: Check static link checker unit tests
        run: node --test apps/web/scripts/check-links.test.mjs
      - name: Check links and anchor targets on exported pages
        run: node apps/web/scripts/check-links.mjs
      - name: Publish static website artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: mimt-web-static
          path: apps/web/out/
          if-no-files-found: error
          retention-days: 7
